[workspace]
resolver = "2"
members = [
    "crates/pixelflow-core",
    "crates/pixelflow-processing",
    "crates/pixelflow-capture",
    "crates/pixelflow-wayland",
    "crates/pixelflow-present",
    "crates/pixelflow-cli",
    "crates/pixelflow-gpu",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Bonzupii"]

[workspace.dependencies]
pixelflow-core = { path = "crates/pixelflow-core" }
pixelflow-processing = { path = "crates/pixelflow-processing" }
pixelflow-capture = { path = "crates/pixelflow-capture" }
pixelflow-wayland = { path = "crates/pixelflow-wayland" }
pixelflow-present = { path = "crates/pixelflow-present" }
pixelflow-gpu = { path = "crates/pixelflow-gpu" }
clap = { version = "4", features = ["derive"] }
png = "0.18"
ashpd = { version = "0.14", features = ["screencast", "pipewire"] }
pipewire = { version = "0.10", features = ["v0_3_44"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
futures-util = "0.3"
zbus = "6"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
naga = { version = "30", features = ["wgsl-in"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
allow_attributes = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
