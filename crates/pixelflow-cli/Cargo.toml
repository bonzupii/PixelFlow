[package]
name = "pixelflow-cli"
version = "0.1.0"
edition = "2024"
description = "PixelFlow command-line interface"

[[bin]]
name = "pixelflow"
path = "src/main.rs"

[[bin]]
name = "pixelflow-bench"
path = "src/bin/bench.rs"

[dependencies]
pixelflow-core = { workspace = true }
pixelflow-processing = { workspace = true }
pixelflow-gpu = { workspace = true }
pixelflow-capture = { workspace = true }
pixelflow-wayland = { workspace = true }
pixelflow-present = { workspace = true }
clap = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
