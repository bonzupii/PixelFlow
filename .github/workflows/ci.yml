name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev: pipewire-sys probes libpipewire-0.3 via system_deps
          # libspa-0.2-dev: libspa-sys probes libspa-0.2 via system_deps
          # libwayland-dev: wayland-sys probes wayland-client, wayland-cursor,
          #   wayland-egl and wayland-server via pkg-config at build time
          #   (nothing links against them; wayland-sys dlopens at runtime)
          # libclang-dev: pipewire-sys and libspa-sys run bindgen
          #   unconditionally in their build scripts, and bindgen needs libclang
          # pkg-config: the pkg-config binary used by the system_deps and
          #   pkg_config build-script probes
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libclang-dev \
            pkg-config
      - run: ./ci/clippy-gate.sh

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev: pipewire-sys probes libpipewire-0.3 via system_deps
          # libspa-0.2-dev: libspa-sys probes libspa-0.2 via system_deps
          # libwayland-dev: wayland-sys probes wayland-client, wayland-cursor,
          #   wayland-egl and wayland-server via pkg-config at build time
          #   (nothing links against them; wayland-sys dlopens at runtime)
          # libclang-dev: pipewire-sys and libspa-sys run bindgen
          #   unconditionally in their build scripts, and bindgen needs libclang
          # pkg-config: the pkg-config binary used by the system_deps and
          #   pkg_config build-script probes
          # libx11-dev: the interception tests compile glx_target.c and
          #   x11_target.c with the system C compiler; both include
          #   X11/Xlib.h and X11/Xutil.h
          # libxext-dev: x11_target.c includes X11/extensions/XShm.h
          # libgl1-mesa-dev: GL development headers and the libGL.so link
          #   for the interception tests' GLX target, which links libGL
          # libsdl1.2-dev: the interception tests compile sdl_soft_target.c,
          #   which includes SDL/SDL.h, and run sdl-config for its flags
          # xvfb: the interception tests launch Xvfb to run the targets
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libclang-dev \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libgl1-mesa-dev \
            libsdl1.2-dev \
            xvfb
      # No PIXELFLOW_FIXTURES_DIR is set here on purpose: the regression
      # tests compare against copyrighted game screenshots that are never
      # committed, so they skip without fixtures. That is the expected CI
      # behavior. The 46 fixture-free tests still run; the 2 fixture
      # regression tests skip.
      - run: cargo build --release
      - run: cargo test --release
